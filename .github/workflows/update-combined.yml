name: Update Combined NIFTY Dashboard

on:
  schedule:
    # Exact window: 09:20-15:30 IST = 03:50-10:00 UTC, Mon-Fri, every 5 min.
    # 09:20 lands on a standard 5-min-aligned UTC minute (03:50), so this
    # only needs 3 short lines:
    #   03:50, 03:55                          -> 09:20, 09:25 IST
    #   every 5 min from 04:00 through 09:55  -> 09:30 IST ... 15:25 IST
    #   10:00                                 -> 15:30 IST (market close)
    # NOTE: GitHub cron is best-effort - actual runs can slip well past the
    # nominal interval under GitHub-wide load (the breadth tracker's own
    # "every 5 min" schedule has been landing ~13 min apart on average).
    - cron: "50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write   # needed so this workflow can commit the updated dashboards back to the repo

concurrency:
  group: nifty-combined-update   # one group now that both trackers run in the same job
  cancel-in-progress: false      # never cancel a run mid-write; let it finish and commit

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata   # GitHub runners default to UTC - this makes datetime.now() in both scripts return IST
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Run both trackers, then build the combined page
        working-directory: docs
        run: python run_combined.py

      - name: Commit and push updated dashboards
        run: |
          git config user.name "nifty-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nifty_breadth_dashboard.html docs/H1_avg \
                  docs/option_score.html docs/option_score \
                  docs/dashboard.html
          # Only commit if something actually changed (e.g. NSE was unreachable this cycle)
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update combined dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          else
            echo "No changes this cycle - nothing to commit."
          fi
