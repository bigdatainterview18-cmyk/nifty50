name: Update NIFTY Breadth Dashboard

on:
  schedule:
    # Exact NSE market hours: 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri.
    # One cron line per field can't express "start at :45, then every 5 min,
    # then stop exactly at :00" on its own, so this is split into 3 lines
    # that together cover exactly that window, every 5 minutes, no buffer:
    #   03:45, 03:50, 03:55                  -> 09:15, 09:20, 09:25 IST
    #   every 5 min from 04:00 through 09:55  -> 09:30 IST ... 15:25 IST
    #   10:00                                 -> 15:30 IST (market close)
    # NOTE: GitHub cron is best-effort - actual runs can slip by a few
    # minutes under GitHub-wide load, especially at the top of the hour.
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write   # needed so this workflow can commit the updated dashboard back to the repo

concurrency:
  group: nifty-dashboard-update
  cancel-in-progress: false   # never cancel a run mid-write; let it finish and commit

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata   # GitHub runners default to UTC - this makes datetime.now() in the script return IST, matching your local PC
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Run one fetch + dashboard update cycle
        working-directory: docs
        run: python run_ci.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "nifty-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nifty_breadth_dashboard.html docs/H1_avg
          # Only commit if something actually changed (e.g. NSE was unreachable this cycle)
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Someone may have pushed a commit (e.g. a manual web edit) after this
            # run checked out the repo. Rebase onto the latest remote main before
            # pushing so we don't get rejected - this is what "fetch first" means.
            git pull --rebase origin main
            git push
          else
            echo "No changes this cycle - nothing to commit."
          fi
